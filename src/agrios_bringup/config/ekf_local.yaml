ekf_local:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # ---- wheel odometry (velocity only) ----
    odom0: /odom_cov
    # x  y  z | roll pitch yaw | vx vy vz | vroll vpitch vyaw | ax ay az
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]    
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false
    # odom0_twist_rejection_threshold: 0.5

    # ---- IMU (raw rates + accel, NOT fused orientation) ----
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_twist_rejection_threshold: 1.0
    # imu0_linear_acceleration_rejection_threshold: 5.0

